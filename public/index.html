<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Fortune Cookie Message Maker</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fff3e0 0%, #ffdca8 100%);
    font-family: 'Georgia', system-ui, sans-serif;
    color: #5a3410;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .icon { font-size: 2rem; margin-bottom: 4px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #b3660c; font-weight: 800; }
  .subtitle { color: #8a5f2e; margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(179,102,12,0.12);
  }
  input[type=text] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #f5d9ab;
    background: #fffaf1;
    color: #5a3410;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    text-align: center;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    background: #cf8225;
    color: #fff;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #8a5f2e; min-height: 1.2em; }
  .fortune-slip {
    margin-top: 22px;
    background: #fff6e6;
    border: 2px dashed #e0ac54;
    border-radius: 12px;
    padding: 20px 18px;
    font-size: 1.15rem;
    font-style: italic;
    line-height: 1.5;
    color: #7a4a12;
  }
  .footer-note { color: #8a5f2e; font-size: 0.78rem; margin-top: 20px; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #ffdca8;
    border-top-color: #cf8225;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🥠</div>
    <h1>QVAC Fortune Cookie Message Maker</h1>
    <p class="subtitle">Enter an optional theme, or leave blank for a random fortune. 100% on-device.</p>

    <div class="card">
      <input type="text" id="mainInput" placeholder="Optional theme, e.g. love, career, luck" />
      <button class="action" id="generateBtn">Crack Open a Fortune</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const theme = mainInput.value.trim();
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Cracking open your cookie...';

      try {
        const res = await fetch('/api/fortune', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ theme }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = `<div class="fortune-slip">"${escapeHtml(data.fortune)}"</div>`;
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') generate(); });
  </script>
</body>
</html>
